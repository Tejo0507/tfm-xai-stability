# Ablation: TFM internal ensemble size n_estimators = 16 (main grid: 4). Also the
# "one context, bigger ensemble" alternative to context bagging (H4 remedy comparison).
datasets: configs/datasets_exact.yaml
models: [tabpfn_v2_5, tabicl_v2]
k: [128, 1024]
n_contexts: 10
model_seeds: [0, 1]
explainer_seeds: [0]
replicate_contexts: 3
sampling: uniform
n_explain: 200
n_estimators: 16
sv: {exact_if_d_le: 8, budget: 512, oracle_budget: 20000}
device: cuda
cpu_jobs: 4
results_dir: results/ablation_ensemble16
