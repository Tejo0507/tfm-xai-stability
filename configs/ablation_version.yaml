# Ablation: TabPFN v2 against TabPFN-2.5 (main grid), same contexts and n_estimators.
datasets: configs/datasets_exact.yaml
models: [tabpfn_v2]
k: [128, 512, 1024]
n_contexts: 10
model_seeds: [0, 1]
explainer_seeds: [0]
replicate_contexts: 3
sampling: uniform
n_explain: 200
n_estimators: 4
sv: {exact_if_d_le: 8, budget: 512, oracle_budget: 20000}
device: cuda
cpu_jobs: 4
results_dir: results/ablation_version
