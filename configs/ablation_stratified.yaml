# Ablation: class-stratified context sampling (main grid: uniform), all four models.
datasets: configs/datasets_exact.yaml
models: [tabpfn_v2_5, tabicl_v2, xgboost, logreg]
k: [128, 1024]
n_contexts: 10
model_seeds: [0, 1]
explainer_seeds: [0]
replicate_contexts: 3
sampling: stratified
n_explain: 200
n_estimators: 4
sv: {exact_if_d_le: 8, budget: 512, oracle_budget: 20000}
device: cuda
cpu_jobs: 4
results_dir: results/ablation_stratified
