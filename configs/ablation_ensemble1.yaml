# Ablation: TFM internal ensemble size n_estimators = 1 (main grid: 4).
# Contexts, explained points and Shapley masks are identical to the main grid.
datasets: configs/datasets_exact.yaml
models: [tabpfn_v2_5, tabicl_v2]
k: [128, 1024]
n_contexts: 10
model_seeds: [0, 1]
explainer_seeds: [0]
replicate_contexts: 3
sampling: uniform
n_explain: 200
n_estimators: 1
sv: {exact_if_d_le: 8, budget: 512, oracle_budget: 20000}
device: cuda
cpu_jobs: 4
results_dir: results/ablation_ensemble1
