# Ablation: correlation-grouped Shapley values (players = feature groups with |rho| > 0.7).
# Contexts and explained points match the main grid.
datasets: configs/datasets_grouped.yaml
models: [tabpfn_v2_5, tabicl_v2, xgboost, logreg]
k: [128, 1024]
n_contexts: 10
model_seeds: [0, 1]
explainer_seeds: [0]
replicate_contexts: 3
sampling: uniform
n_explain: 200
n_estimators: 4
grouping: {threshold: 0.7}
sv: {exact_if_d_le: 9, budget: 512, oracle_budget: 20000}
device: cuda
cpu_jobs: 4
results_dir: results/ablation_grouped
