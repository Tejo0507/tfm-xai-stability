datasets: configs/datasets.yaml
models: [tabpfn_v2_5, tabicl_v2, xgboost, logreg]
k: [128, 512, 1024]          # 2048 dropped: it alone doubled the 4050 budget (timing, 2026-10-31)
n_contexts: 10
model_seeds: [0, 1]
explainer_seeds: [0, 1]
replicate_contexts: 3       # 2nd model seed / 2nd explainer seed only on contexts 0-2 (pilot: seed var 35-190x below context var)
sampling: uniform
n_explain: 200
n_estimators: 4              # same internal ensemble size for TabPFN and TabICL
sv: {exact_if_d_le: 8, budget: 512, oracle_budget: 20000}
device: cuda
cpu_jobs: 4
results_dir: results/main
