name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The unit tests use logistic regression and synthetic data only, so the GPU
      # stack (torch, tabpfn, tabicl) and xgboost are not installed in CI.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.5.4 pandas==3.1.0 scipy==1.18.1 scikit-learn==1.9.1 \
            statsmodels==0.15.0 matplotlib==3.11.2 pyyaml==6.0.3 pytest==9.2.0
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -q
